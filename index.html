<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
    <h1 className="flex -between">TODO LIST</h1>
    <input type = "text"></body></input>
    <button onclick="addTodo()">Add todo!</button>
    <button onclick="deleteLastTodo()">Delete last todo</button>
    <button onclick="deleteFirstTodo">Delete first todo</button>
    <div id="todos"></div>
    <script>
        let todos=[]
        function addTodo()
        {
            todos.push({
                title: document.querySelector('input').value
            })   
            render() 
        }
        function deleteTodo(todoToDelete)
        {
            todos = todos.filter(todo => todo !== todoToDelete);
            render();
        }
        function deleteLastTodo()
        {
            //remove the last element from array
            todos.splice(todos.length-1,1)
            render()
        }

        function deleteFirstTodo()
        {
            //remove the first element from array
            todos.splice(0,1)
            render()
        }
        //generate todo div for u
        function createTodoComponent(todo)
        {

            const div = document.createElement("div")
            const h1 = document.createElement("h1")
            const button = document.createElement("button");
            h1.innerHTML=todo.title;
            button.innerHTML="Delete"
            button.onclick = () => deleteTodo(todo);
            
            div.append(h1)
            div.append(button)
            return div
        }
        //react
        function render()
        {
            document.querySelector('#todos').innerHTML="";
            for(let i=0;i<todos.length;i++)
            {
                const element = createTodoComponent(todos[i])
                document.querySelector("#todos").appendChild(element)
            }
        }


    </script>
</body>
</html>
